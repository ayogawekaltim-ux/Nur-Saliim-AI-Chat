name: Build Nur & Saliim AI Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP source tidak ditemukan."
            exit 1
          fi

          echo "Source ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle(.kts) tidak ditemukan."
            echo "Isi hasil ekstraksi:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project ditemukan di: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK yang dihasilkan:"
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nur-Saliim-AI-Chat-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
